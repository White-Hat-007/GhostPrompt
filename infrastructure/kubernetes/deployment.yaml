apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghostprompt-backend
  namespace: ghostprompt
  labels:
    app: ghostprompt
    component: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ghostprompt
      component: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ghostprompt
        component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: ghostprompt
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: backend
          image: ghostprompt/backend:latest
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: APP_ENV
              value: "production"
            - name: APP_DEBUG
              value: "false"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ghostprompt-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: ghostprompt-secrets
                  key: redis-url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ghostprompt-secrets
                  key: secret-key
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ghostprompt-secrets
                  key: jwt-secret-key
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: models
              mountPath: /app/models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ghostprompt-models-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ghostprompt-backend
  namespace: ghostprompt
  labels:
    app: ghostprompt
    component: backend
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
  selector:
    app: ghostprompt
    component: backend
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ghostprompt-backend-hpa
  namespace: ghostprompt
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ghostprompt-backend
  minReplicas: 3
  maxReplicas: 50
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ghostprompt-ingress
  namespace: ghostprompt
  annotations:
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.ghostprompt.ai
        - app.ghostprompt.ai
      secretName: ghostprompt-tls
  rules:
    - host: api.ghostprompt.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ghostprompt-backend
                port:
                  number: 8000
    - host: app.ghostprompt.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ghostprompt-frontend
                port:
                  number: 3000
